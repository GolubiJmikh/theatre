<main>
<form class="registration-form" action="#" method="post" style="display: flex; align-items: center; flex-direction: column;margin: 0 auto;">
  <h2>Регистрация</h2>
  
  <div class="form-group">
    <label for="name">Имя:</label>
    <input type="text" id="name" name="name" required>
  </div>
  
  <div class="form-group">
    <label for="surname">Фамилия:</label>
    <input type="text" id="surname" name="surname" required>
  </div>
  
  <div class="form-group">
    <label for="phone">Телефон:</label>
    <input type="tel" id="phone" name="phone" required placeholder="+7 (___) ___-__-__">
  </div>
  
  <div class="form-group">
    <label for="login">Логин:</label>
    <input type="text" id="login" name="login" required>
  </div>
  
  <div class="form-group">
    <label for="password">Пароль:</label>
    <input type="password" id="password" name="password" required>
  </div>
  
  <div class="form-group">
    <label for="confirm_password">Подтверждение пароля:</label>
    <input type="password" id="confirm_password" name="confirm_password" required>
  </div>
  
  <div class="form-group checkbox-group">
    <input type="checkbox" id="terms" name="terms" required>
    <label for="terms">Я согласен(на) с условиями использования и политикой конфиденциальности</label>
  </div>
  
  <div class="form-group">
    <button type="submit">Зарегистрироваться</button>
  </div>
</form>
